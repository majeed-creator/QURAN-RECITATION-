<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1f1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<meta name="description" content="Free Quran player: all-day recitation that pauses for azan and prohibited times, with Urdu translation and highlighted verses.">
<meta property="og:title" content="Quran Player">
<meta property="og:description" content="Free Quran recitation with azan pauses, Urdu translation and highlighted verses.">
<title>Quran Player</title>
<style>
:root{--bg:#0d1f1c;--card:#14302b;--ink:#e6f0ec;--mute:#9ab3ac;--line:#2b4f47;--azan:#3fb58c;--proh:#e08a5c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.5 system-ui,Roboto,sans-serif}
body.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",system-ui,serif;line-height:2}
main{max-width:1000px;margin:0 auto;padding:20px 28px 60px}
h1{font:700 3rem/1.3 Amiri,serif;margin:0;text-align:center}
h2{font-size:1.1rem;margin:0 0 8px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.top{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:640px;max-height:90vh;overflow:auto}
.card p{margin:10px 0}
.top select{width:auto;padding:8px 14px}
.status{font-size:2rem;font-weight:700;margin:0}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--mute);margin-right:12px}
.dot.play{background:var(--azan)}.dot.hold{background:var(--proh)}
.note{color:var(--mute);margin:6px 0 0}
.sn1{font:700 2.6rem/1.5 Amiri,serif;margin:6px 0 0;text-align:center}.sn2{text-align:center;color:var(--mute);margin:0}
button,select,input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 20px}
input[type=range]{padding:0;width:100%}
input[type=file]{padding:8px;width:100%}
button.main{background:var(--azan);color:#04201a;font-weight:700;border-color:var(--azan);min-width:200px}
button:focus,select:focus,input:focus,summary:focus{outline:5px solid #fff;outline-offset:3px}
.sm{padding:8px 14px;font-size:.8em}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;align-items:center}
.bar{position:relative;height:40px;background:var(--bg);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.seg{position:absolute;top:0;bottom:0;min-width:3px}.seg.a{background:var(--azan)}.seg.p{background:var(--proh)}
.now{position:absolute;top:0;bottom:0;width:4px;background:#fff}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute)}
label{display:block;color:var(--mute);font-size:.85em;margin:8px 0 4px}
select{width:100%}
summary{cursor:pointer;font-weight:700;padding:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hide{display:none!important}
#tx{max-height:520px;overflow-y:auto;padding:4px 8px;position:relative;scroll-behavior:smooth;margin-top:12px}
.ay{padding:12px 14px;border-radius:14px;border:2px solid transparent;cursor:pointer}
.ay.on{background:#1d5a4a;border-color:var(--azan)}.ay.on div{color:#fff!important}
.ar{font:400 calc(1.9rem*var(--fs,1))/2.2 Amiri,serif;direction:rtl;text-align:right}
.ur{font:400 calc(1.35rem*var(--fs,1))/2.6 "Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;direction:rtl;text-align:right;color:#bfe3d6}
.en{font-size:calc(1.1rem*var(--fs,1));color:#bfe3d6;text-align:left;direction:ltr}
.tf{font:400 calc(1rem*var(--fs,1))/1.9 Amiri,serif;direction:rtl;text-align:right;color:var(--mute);margin-top:4px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:18px;color:var(--mute);font-size:.8em;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
#prt{display:none;direction:ltr}
@page{margin:16mm}
@media print{body{background:#fff}main>*:not(#prt){display:none!important}#prt{display:block!important}#prt *{color:#000!important;background:none!important}#prt .ay{border:0;border-bottom:1px solid #ccc;break-inside:avoid}#prt h2{text-align:center;font:700 2rem Amiri,serif}}
</style>
</head>
<body>
<main>
<div class="top"><button class="sm" id="hp" aria-label="Help">?</button><button class="sm" id="shb" data-t="share"></button><button class="sm" id="wab" data-t="wa"></button><button class="sm hide" id="inb" data-t="inst"></button><select id="lg" aria-label="Language"><option value="en">English</option><option value="ur">اردو</option></select></div>
<p class="note hide" id="ih" data-t="ios" style="text-align:right"></p><p class="note" id="im" style="text-align:right"></p>
<h1>القرآن الكريم</h1>

<section>
  <p class="status"><span class="dot" id="dot"></span><span id="st"></span></p>
  <p class="sn1" id="nma"></p><p class="sn2" id="nme"></p>
  <p class="note" id="sn"></p>
  <p class="note" id="dt"></p>
  <p class="note" id="cd" style="font-weight:700;color:var(--ink)"></p>
  <p class="note hide" id="ap" data-t="tap" style="color:var(--proh);font-weight:700"></p>
  <div class="row">
    <button class="main" id="go" data-t="start"></button>
    <button id="pv" data-t="prev"></button>
    <button id="nx" data-t="next"></button>
    <button id="fv" aria-label="Favorite">☆</button>
  </div>
  <div class="g">
    <div><label for="vo" data-t="l_vol"></label><input id="vo" type="range" min="0" max="100"></div>
    <div><label for="sl" data-t="l_sleep"></label><select id="sl"><option value="0" data-t="o_off"></option><option value="15">15</option><option value="30">30</option><option value="60">60</option><option value="90">90</option><option value="120">120</option></select></div>
  </div>
</section>

<section>
  <h2 data-t="h_loc"></h2>
  <p class="note" id="lp" style="margin:0 0 8px"></p>
  <div class="row"><button id="gl" data-t="b_gl"></button></div>
  <div class="row"><input id="cs" data-ph="ph_city" style="flex:1;min-width:200px"><button id="csb" data-t="b_search"></button></div>
  <div id="cr" class="row"></div>
  <div style="margin-top:10px"><label for="city" data-t="l_pk"></label><select id="city"></select></div>
  <p class="note" id="lm"></p>
  <p class="note" data-t="tzn"></p>
</section>

<section>
  <div class="g">
    <div><label for="vs" data-t="l_vs"></label><select id="vs"><option value="1" data-t="o_show"></option><option value="0" data-t="o_hide"></option></select></div>
    <div><label for="ed" data-t="l_ed"></label><select id="ed"><option value="ur.jalandhry">اردو – Jalandhry</option><option value="ur.maududi">اردو – Maududi</option><option value="ur.kanzuliman">اردو – Kanzul Iman</option><option value="ur.junagarhi">اردو – Junagarhi</option><option value="en.sahih">English – Sahih International</option><option value="none" data-t="o_none"></option></select></div>
    <div><label for="tf" data-t="l_tf"></label><select id="tf"><option value="" data-t="o_none"></option><option value="ar.muyassar">تفسير الميسر (Arabic)</option><option value="ar.jalalayn">تفسير الجلالين (Arabic)</option></select></div>
    <div><label for="fs" data-t="l_fs"></label><select id="fs"><option value="1" data-t="o_norm"></option><option value="1.25" data-t="o_large"></option><option value="1.5" data-t="o_xl"></option></select></div>
    <div><label for="as" data-t="l_as"></label><select id="as"><option value="1" data-t="o_on"></option><option value="0" data-t="o_off"></option></select></div>
  </div>
  <p class="note" id="sy"></p>
  <div class="row" id="tb"><button class="sm" id="hb" data-t="b_hb"></button><button class="sm" id="hf" data-t="b_hf"></button><span class="note" id="ho"></span></div>
  <div id="tx" class="hide" tabindex="0"></div>
</section>

<section>
  <div class="g">
    <div><label for="rc" data-t="l_reciter"></label><select id="rc"></select></div>
    <div id="mow"><label for="mo" data-t="l_style"></label><select id="mo"></select></div>
    <div><label for="su" data-t="l_surah"></label><select id="su"></select></div>
    <div><label for="fvs" data-t="l_fav"></label><select id="fvs"></select></div>
    <div><label for="md" data-t="l_after"></label><select id="md"><option value="next" data-t="o_cont"></option><option value="repeat" data-t="o_rep"></option></select></div>
    <div><label for="sc" data-t="l_play"></label><select id="sc"><option value="all" data-t="o_all"></option><option value="custom" data-t="o_set"></option></select></div>
  </div>
  <div class="g hide" id="cu">
    <div><label for="sh" data-t="l_sh"></label><select id="sh"></select></div>
    <div><label for="sm" data-t="l_sm"></label><select id="sm"></select></div>
    <div><label for="sa">AM / PM</label><select id="sa"><option>AM</option><option>PM</option></select></div>
    <div><label for="hr" data-t="l_hr"></label><select id="hr"></select></div>
  </div>
</section>

<section>
  <h2 data-t="h_dl"></h2>
  <p class="note" style="margin:0" id="dn"></p>
  <div class="row"><button id="dpdf" data-t="b_pdf"></button><button id="daud" data-t="b_aud"></button><button id="dvid" data-t="b_vid"></button></div>
  <div class="row"><button id="soff" data-t="b_off"></button><button class="alt" id="xoff" data-t="b_offx"></button><span class="note" id="oc"></span></div>
  <p class="note" id="dm"></p>
</section>

<section>
  <h2 data-t="h_sched"></h2>
  <div class="bar" id="bar"><div class="now" id="nowm"></div></div>
  <div class="legend"><span><i style="background:var(--azan)"></i><span data-t="lg_a"></span></span><span><i style="background:var(--proh)"></i><span data-t="lg_p"></span></span></div>
  <table><thead><tr><th data-t="th_p"></th><th data-t="th_t"></th><th data-t="th_q"></th></tr></thead><tbody id="tt"></tbody></table>
</section>

<section>
  <h2 data-t="h_plan"></h2>
  <div id="pl"></div>
  <div class="g" style="margin-top:10px">
    <div><label for="pd" data-t="l_day"></label><select id="pd"><option value="all" data-t="o_every"></option><option value="fri" data-t="o_fri"></option></select></div>
    <div><label for="ph" data-t="l_sh"></label><select id="ph"></select></div>
    <div><label for="pm" data-t="l_sm"></label><select id="pm"></select></div>
    <div><label for="pa">AM / PM</label><select id="pa"><option>AM</option><option>PM</option></select></div>
    <div><label for="ps" data-t="l_surah"></label><select id="ps"></select></div>
    <div><label for="pn" data-t="l_after"></label><select id="pn"><option value="next" data-t="o_cont"></option><option value="repeat" data-t="o_rep"></option></select></div>
  </div>
  <div class="row"><button id="padd" data-t="b_add"></button><button id="pkh" data-t="b_kahf"></button></div>
</section>

<section>
  <details>
    <summary data-t="h_set"></summary>
    <div class="g">
      <div><label for="meth" data-t="l_meth"></label><select id="meth"><option value="k" data-t="m_k"></option><option value="m" data-t="m_m"></option><option value="i" data-t="m_i"></option><option value="e" data-t="m_e"></option><option value="u" data-t="m_u"></option></select></div>
      <div><label for="az" data-t="l_az"></label><input id="az" type="number" min="1" max="60"></div>
      <div><label for="jm" data-t="l_jm"></label><input id="jm" type="number" min="10" max="180"></div>
      <div><label for="sr" data-t="l_sr"></label><input id="sr" type="number" min="0" max="60"></div>
      <div><label for="zw" data-t="l_zw"></label><input id="zw" type="number" min="0" max="60"></div>
      <div><label for="ss" data-t="l_ss"></label><input id="ss" type="number" min="0" max="60"></div>
      <div><label for="pr" data-t="l_pr"></label><select id="pr"><option value="1" data-t="o_yes"></option><option value="0" data-t="o_no"></option></select></div>
      <div><label for="hj" data-t="l_hj"></label><select id="hj"><option value="-1">-1</option><option value="0">0</option><option value="1">+1</option></select></div>
      <div><label for="auto" data-t="l_auto"></label><select id="auto"><option value="1" data-t="o_yes"></option><option value="0" data-t="o_no"></option></select></div>
      <div><label for="azOn" data-t="l_azs"></label><select id="azOn"><option value="1" data-t="o_yes"></option><option value="0" data-t="o_no"></option></select></div>
      <div><label for="azf" data-t="l_azf"></label><input id="azf" type="file" accept="audio/*"></div>
      <div><label for="fjf" data-t="l_fjf"></label><input id="fjf" type="file" accept="audio/*"></div>
      <div><label for="azu" data-t="l_azu"></label><input id="azu" type="url" placeholder="https://"></div>
    </div>
    <div class="row"><button class="sm" id="ta" data-t="b_test"></button><span class="note" id="am"></span></div>
    <p class="note" data-t="l_adj"></p>
    <div class="g" id="adj"></div>
  </details>
  <p class="note" data-t="note_tv"></p>
</section>
<section>
  <h2 data-t="h_about"></h2>
  <p class="note" data-t="about"></p>
</section>
<div id="wl" class="ov hide" role="dialog" aria-modal="true"><div class="card">
  <h2 data-t="w_title" style="font-size:1.6rem"></h2>
  <p data-t="w1"></p><p data-t="w2"></p><p data-t="w3"></p><p data-t="w4"></p>
  <div class="row"><button id="wgl" data-t="b_gl"></button><button class="main" id="wok" data-t="b_ok"></button></div>
</div></div>
<div id="prt"></div>
<audio id="au"></audio>
</main>

$('adj').innerHTML=P.map(function(p){return'<div><label for="a'+p+'" data-t="p_'+p+'"></label><input id="a'+p+'" type="number" min="-30" max="30"></div>'}).join('');
P.forEach(function(p){var el=$('a'+p);el.value=S.adj[p]||0;el.onchange=function(){S.adj[p]=parseFloat(el.value)||0;save();render();tick()}});
function applyLang(){
  document.body.className=S.lang==='ur'?'ur':'';document.documentElement.lang=S.lang;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=t(e.getAttribute('data-t'))});
  [].forEach.call(document.querySelectorAll('[data-ph]'),function(e){e.placeholder=t(e.getAttribute('data-ph'))});
  [].forEach.call($('sl').options,function(o){if(o.value!=='0')o.textContent=o.value});
  setGo();vbtn(!!rec);fillRc();placeUi();render();planUi();offCount();offtxt();shownm();dnTxt();buildSync();tick();
}

/* ---------- location, welcome, share ---------- */
function placeUi(){var l=loc(),p=S.place||S.city||'Makkah';$('lp').textContent=t('l_cur')+': '+p+' ('+l[0].toFixed(2)+', '+l[1].toFixed(2)+')'}
function setPlace(lat,lon,pl,cc){
  S.lat=+lat.toFixed(3);S.lon=+lon.toFixed(3);S.place=pl;S.city='';
  if(cc){S.m=(cc==='PK'||cc==='IN'||cc==='BD'||cc==='AF')?'k':cc==='SA'?'u':cc==='EG'?'e':(cc==='US'||cc==='CA')?'i':'m';$('meth').value=S.m}
  save();placeUi();render();tick();$('lm').textContent=t('loc_set');
}
$('city').onchange=function(){var c=$('city').value;if(!c)return;setPlace(CITIES[c][0],CITIES[c][1],c,'PK');$('city').value=''};
function geo(){
  if(!navigator.geolocation){$('lm').textContent=t('loc_err');return}
  navigator.geolocation.getCurrentPosition(function(p){setPlace(p.coords.latitude,p.coords.longitude,t('myloc'),null)},function(){$('lm').textContent=t('loc_err')},{timeout:15000,maximumAge:3600000});
}
$('gl').onclick=geo;$('wgl').onclick=geo;
function search(){
  var q=$('cs').value.trim();if(q.length<2)return;var box=$('cr');box.innerHTML='';
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language='+(S.lang==='ur'?'ur':'en')+'&format=json').then(j).then(function(d){
    var L=d.results||[];if(!L.length){$('lm').textContent=t('no_res');return}$('lm').textContent='';
    L.forEach(function(r){var b=document.createElement('button');b.className='sm';b.textContent=[r.name,r.admin1,r.country].filter(Boolean).join(', ');b.onclick=function(){setPlace(r.latitude,r.longitude,b.textContent,r.country_code);box.innerHTML=''};box.appendChild(b)});
  }).catch(function(){$('lm').textContent=t('srch_err')});
}
$('csb').onclick=search;$('cs').onkeydown=function(e){if(e.key==='Enter')search()};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return 1}}
function wl(v){$('wl').className=v?'ov':'ov hide';if(v)$('wok').focus()}
$('hp').onclick=function(){wl(true)};
$('wok').onclick=function(){try{localStorage.setItem('qw3','1')}catch(e){}wl(false)};
if(!lsGet('qw3'))wl(true);
var dfr=null,SU=location.href.split('#')[0];
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dfr=e;$('inb').className='sm'});
window.addEventListener('appinstalled',function(){$('inb').className='sm hide'});
$('inb').onclick=function(){if(dfr){dfr.prompt();dfr=null;$('inb').className='sm hide'}};
if(/iphone|ipad|ipod/i.test(navigator.userAgent||'')&&!navigator.standalone)$('ih').className='note';
$('shb').onclick=function(){
  var d={title:'Quran Player',text:t('share_txt'),url:SU};
  if(navigator.share)navigator.share(d).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(SU).then(function(){$('im').textContent=t('copied')}).catch(function(){$('im').textContent=SU});
  else $('im').textContent=SU;
};
$('wab').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(t('share_txt')+' '+SU),'_blank')};
/* ---------- boot ---------- */
try{var sv=JSON.parse(localStorage.getItem('qrl')||'null');if(sv&&sv.length)rcs=sv}catch(e){}
if(!rcs.length)rcs=[{k:'m:1',type:'m',id:1,name:'Ibrahim Al-Akdar',moshaf:[{id:1,name:'Hafs - Murattal',server:'https://server6.mp3quran.net/akdr/'}]},{k:'m:2',type:'m',id:2,name:'Maher Al-Muaiqly',moshaf:[{id:2,name:'Hafs - Murattal',server:'https://server12.mp3quran.net/maher/'}]}];
function boot(){
  fillRc();applyLang();
  if(S.auto&&S.run){running=true;setGo();lock()}
  load(idxOf(S.cur),S.pos);
  if(running)setTimeout(function(){if(running&&au.paused&&!blocked()&&!ldg&&curInfo)needTap(true)},4000);
}
Promise.race([loadLists().catch(function(){}),new Promise(function(r){setTimeout(r,7000)})]).then(boot);
fetch('https://www.mp3quran.net/api/v3/suwar?language=eng').then(j).then(function(d){d.suwar.forEach(function(s){names[s.id]=s.name.trim()});fillSu();shownm();dnTxt();planUi()}).catch(function(){});
fetch('https://www.mp3quran.net/api/v3/suwar?language=ar').then(j).then(function(d){d.suwar.forEach(function(s){namesAr[s.id]=s.name.trim()});fillSu();shownm()}).catch(function(){});
$('rc').onchange=function(){S.rk=$('rc').value;S.mid=0;fillMo();save();if(running||au.src)load(idxOf(S.cur),0);tick()};
$('mo').onchange=function(){S.mid=+$('mo').value;save();load(idxOf(S.cur),0)};
setInterval(tick,1000);setInterval(render,6e4);
})();
</script>
</body>
</html>
